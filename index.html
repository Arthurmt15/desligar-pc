<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desligar PC — Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/input.css">
</head>
<body>
<div class="bg"></div>
<div class="shell">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="logo">⬢</div>
      <div>
        <h1>DESLIGAR PC</h1>
        <p>LUMEN <span>•</span> v3.0</p>
      </div>
    </div>
    <div class="status" id="statusBadge"><i></i>OCIOSO</div>
  </header>

  <div class="grid">
    <!-- Hero -->
    <section class="hero">
      <div class="eyebrow">CONTAGEM REGRESSIVA</div>
      <div class="timer">
        <span id="hoursDisplay">00</span><em>:</em><span id="minutesDisplay">00</span><em>:</em><span id="secondsDisplay">00</span>
      </div>
      <div class="cmd">
        <span class="dot"></span>
        <span id="commandText">shutdown /s /t 7200 /f</span>
        <button onclick="copyCommand()" aria-label="Copiar">⎘</button>
      </div>
      <div class="progress">
        <div class="progress-head"><span>PROGRESSO</span><strong id="progressPercent">0%</strong></div>
        <div class="track"><div id="progressBar"></div></div>
        <div class="progress-foot"><span id="progressText">AGUARDANDO</span></div>
      </div>
    </section>

    <!-- Controles -->
    <section class="panel">
      <div class="panel-head">
        <h2>Tempo</h2>
        <span>ESCOLHA RÁPIDA</span>
      </div>
      <div class="presets">
        <button onclick="setTimer(0,15,0)"><strong>15</strong><em>min</em></button>
        <button class="active" onclick="setTimer(0,30,0)"><strong>30</strong><em>min</em></button>
        <button onclick="setTimer(1,0,0)"><strong>1</strong><em>hora</em></button>
        <button onclick="setTimer(2,0,0)"><strong>2</strong><em>horas</em></button>
      </div>
      <div class="custom">
        <div class="field">
          <label>HORAS</label>
          <div class="stepper">
            <button onclick="changeValue('hours',-1)">—</button>
            <input id="hours" type="number" min="0" max="99" value="0">
            <button onclick="changeValue('hours',1)">+</button>
          </div>
        </div>
        <div class="field featured">
          <label>MINUTOS</label>
          <div class="stepper">
            <button onclick="changeValue('minutes',-1)">—</button>
            <input id="minutes" type="number" min="0" max="59" value="30">
            <button onclick="changeValue('minutes',1)">+</button>
          </div>
        </div>
        <div class="field">
          <label>SEGUNDOS</label>
          <div class="stepper">
            <button onclick="changeValue('seconds',-1)">—</button>
            <input id="seconds" type="number" min="0" max="59" value="0">
            <button onclick="changeValue('seconds',1)">+</button>
          </div>
        </div>
      </div>
      <button class="btn-primary" onclick="scheduleShutdown()">AGENDAR DESLIGAMENTO</button>
      <div class="row">
        <button class="btn-ghost" onclick="cancelShutdown()">CANCELAR</button>
        <button class="btn-amber" onclick="shutdownNow()">AGORA</button>
      </div>
      <div class="feedback" id="statusMessage">Pronto para agendar</div>
    </section>
  </div>

  <!-- Footer -->
  <section class="footer">
    <div>
      <h3>Área de Trabalho</h3>
      <p>1 clique • sem navegador</p>
    </div>
    <button class="btn-white" onclick="createShortcut()">CRIAR ATALHO</button>
  </section>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
