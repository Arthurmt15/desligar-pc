<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESLIGAR PC // NEON PROTOCOL v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(13, 19, 33, 0.75);
            --panel-border: rgba(0, 243, 255, 0.2);
            --cyan-neon: #00f3ff;
            --magenta-neon: #ff0055;
            --yellow-neon: #ffbe00;
            --green-neon: #00ff66;
            --text-main: #e2f1af;
            --text-dim: #5a738e;
            --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.4);
            --glow-magenta: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient scanlines */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px; left: 10%; right: 10%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-badge {
            width: 42px;
            height: 42px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan-neon);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--cyan-neon);
            font-size: 1.2rem;
            box-shadow: var(--glow-cyan);
        }

        .title-group h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .title-group .sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--cyan-neon);
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-pill.active {
            border-color: rgba(0, 255, 102, 0.3);
            color: var(--green-neon);
        }

        .status-pill.active .status-dot {
            background: var(--green-neon);
            box-shadow: 0 0 8px var(--green-neon);
        }

        /* Display Timer Panel */
        .timer-display-box {
            background: rgba(5, 8, 15, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .display-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .timer-digits {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            line-height: 1;
            margin: 10px 0;
        }

        .command-preview {
            background: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--cyan-neon);
            border-left: 2px solid var(--cyan-neon);
            margin-bottom: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--cyan-neon), var(--magenta-neon));
            box-shadow: var(--glow-cyan);
            transition: width 0.4s ease;
        }

        /* Section Headings */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--cyan-neon);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 243, 255, 0.2);
        }

        /* Quick Select Buttons */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 10px 0;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-quick:hover {
            border-color: var(--cyan-neon);
            color: var(--cyan-neon);
            background: rgba(0, 243, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Custom Inputs */
        .custom-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .input-card label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
        }

        .number-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .number-control input {
            width: 40px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .spin-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }

        .spin-btn:hover {
            background: var(--cyan-neon);
            color: #000;
            border-color: var(--cyan-neon);
        }

        /* Actions */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-schedule {
            background: var(--cyan-neon);
            color: #070a12;
            box-shadow: var(--glow-cyan);
        }

        .btn-schedule:hover {
            background: #33f5ff;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-cancel {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--magenta-neon);
            color: var(--magenta-neon);
        }

        .btn-cancel:hover {
            background: var(--magenta-neon);
            color: #fff;
            box-shadow: var(--glow-magenta);
            transform: translateY(-2px);
        }

        .btn-now {
            background: rgba(255, 190, 0, 0.1);
            border: 1px solid var(--yellow-neon);
            color: var(--yellow-neon);
        }

        .btn-now:hover {
            background: var(--yellow-neon);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 190, 0, 0.4);
            transform: translateY(-2px);
        }

        .btn-shortcut {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 10px;
            margin-top: 10px;
        }

        .btn-shortcut:hover {
            border-color: var(--cyan-neon);
            color: #fff;
            background: rgba(0, 243, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <div class="icon-badge">
                    <i class="fa-solid fa-power-off"></i>
                </div>
                <div class="title-group">
                    <h1>DESLIGAR PC</h1>
                    <div class="sub">NEON PROTOCOL v2.0</div>
                </div>
            </div>
            <div class="status-pill" id="statusPill">
                <div class="status-dot"></div>
                <span id="statusText">OCIOSO</span>
            </div>
        </header>

        <main>
            <div class="timer-display-box">
                <div class="display-label">T-MINUS // TEMPO RESTANTE</div>
                <div class="timer-digits" id="timerDisplay">00:00:00</div>
                <div class="command-preview" id="cmdPreview">shutdown /s /t 0 /f</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="section-title">
                <i class="fa-solid fa-bolt"></i> ATALHOS RÁPIDOS
            </div>
            <div class="quick-grid">
                <button class="btn-quick" onclick="setQuickTime(15)">15 MIN</button>
                <button class="btn-quick" onclick="setQuickTime(30)">30 MIN</button>
                <button class="btn-quick" onclick="setQuickTime(60)">01 HORA</button>
                <button class="btn-quick" onclick="setQuickTime(120)">02 HORAS</button>
            </div>

            <div class="section-title">
                <i class="fa-solid fa-sliders"></i> TEMPO PERSONALIZADO
            </div>
            <div class="custom-inputs">
                <div class="input-card">
                    <label>HORAS</label>
                    <div class="number-control">
                        <button class="spin-btn" onclick="adjustValue('hours', -1)"><i class="fa-solid fa-minus"></i></button>
                        <input type="number" id="hours" value="0" min="0" max="24" readonly>
                        <button class="spin-btn" onclick="adjustValue('hours', 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
                <div class="input-card">
                    <label>MINUTOS</label>
                    <div class="number-control">
                        <button class="spin-btn" onclick="adjustValue('minutes', -1)"><i class="fa-solid fa-minus"></i></button>
                        <input type="number" id="minutes" value="30" min="0" max="59" readonly>
                        <button class="spin-btn" onclick="adjustValue('minutes', 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
                <div class="input-card">
                    <label>SEGUNDOS</label>
                    <div class="number-control">
                        <button class="spin-btn" onclick="adjustValue('seconds', -1)"><i class="fa-solid fa-minus"></i></button>
                        <input type="number" id="seconds" value="0" min="0" max="59" readonly>
                        <button class="spin-btn" onclick="adjustValue('seconds', 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </div>

            <div class="action-group">
                <button class="btn-main btn-schedule" onclick="startTimer()">
                    <i class="fa-solid fa-clock"></i> AGENDAR DESLIGAMENTO
                </button>
                
                <div class="grid-2">
                    <button class="btn-main btn-cancel" onclick="cancelTimer()">
                        <i class="fa-solid fa-xmark"></i> CANCELAR
                    </button>
                    <button class="btn-main btn-now" onclick="shutdownNow()">
                        <i class="fa-solid fa-skull"></i> AGORA
                    </button>
                </div>

                <button class="btn-shortcut" onclick="createIcon()">
                    <i class="fa-solid fa-link"></i> CRIAR ÍCONE // 1-CLICK NEON_LINK
                </button>
            </div>
        </main>
    </div>

    <script>
        let countdown;
        let totalSeconds = 0;
        let remainingSeconds = 0;

        function adjustValue(id, change) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) + change;
            let max = id === 'hours' ? 24 : 59;
            if (val < 0) val = max;
            if (val > max) val = 0;
            input.value = val;
            updateCommandPreview();
        }

        function setQuickTime(mins) {
            document.getElementById('hours').value = Math.floor(mins / 60);
            document.getElementById('minutes').value = mins % 60;
            document.getElementById('seconds').value = 0;
            updateCommandPreview();
        }

        function getCalculatedSeconds() {
            const h = parseInt(document.getElementById('hours').value) || 0;
            const m = parseInt(document.getElementById('minutes').value) || 0;
            const s = parseInt(document.getElementById('seconds').value) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        function updateCommandPreview() {
            const sec = getCalculatedSeconds();
            document.getElementById('cmdPreview').innerText = `shutdown /s /t ${sec} /f`;
        }

        function formatTime(sec) {
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function startTimer() {
            clearInterval(countdown);
            totalSeconds = getCalculatedSeconds();
            if (totalSeconds <= 0) return;

            remainingSeconds = totalSeconds;
            
            const pill = document.getElementById('statusPill');
            const statusText = document.getElementById('statusText');
            pill.classList.add('active');
            statusText.innerText = 'EXECUTA_';

            updateDisplay();

            countdown = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    clearInterval(countdown);
                    alert('PROTOCOLO DE DESLIGAMENTO INICIADO!');
                    cancelTimer();
                }
            }, 1000);
        }

        function updateDisplay() {
            document.getElementById('timerDisplay').innerText = formatTime(remainingSeconds);
            const progress = ((totalSeconds - remainingSeconds) / totalSeconds) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        function cancelTimer() {
            clearInterval(countdown);
            remainingSeconds = 0;
            document.getElementById('timerDisplay').innerText = "00:00:00";
            document.getElementById('progressBar').style.width = "0%";
            
            const pill = document.getElementById('statusPill');
            const statusText = document.getElementById('statusText');
            pill.classList.remove('active');
            statusText.innerText = 'OCIOSO';
        }

        function shutdownNow() {
            if (confirm('Deseja desligar o sistema imediatamente?')) {
                alert('Executando: shutdown /s /t 0 /f');
            }
        }

        function createIcon() {
            alert('Atalho gerado com sucesso!');
        }

        updateCommandPreview();
    </script>
</body>
</html>
